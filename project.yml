name: open-receipt
include:
  - path: project.local.yml
    enable: ${INCLUDE_LOCAL_SPEC}
options:
  bundleIdPrefix: com.collinmurch
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  open-receipt:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: &agentExcludes
          - "**/.claude"
          - "**/.cc-writes"
          - "**/.codex"
          - "**/.agents"
          - "**/.cursor"
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
      - path: App
        excludes: *agentExcludes
    dependencies:
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      - sdk: MessageUI.framework
      - sdk: FoundationModels.framework
      - sdk: VisionKit.framework
      - sdk: PhotosUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinmurch.open-receipt
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Open Receipt needs camera access to scan receipts."
        INFOPLIST_KEY_NSContactsUsageDescription: "Open Receipt uses selected contacts to add people to receipt splits."
        INFOPLIST_KEY_CFBundleDisplayName: "Open Receipt"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: open-receipt
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          CODE_SIGN_ENTITLEMENTS: App/OpenReceipt.entitlements

  open-receiptTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: *agentExcludes
    dependencies:
      - target: open-receipt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinmurch.open-receiptTests
        GENERATE_INFOPLIST_FILE: YES

  ReceiptKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ReceiptCore
        group: Sources
        excludes: *agentExcludes
    settings:
      base:
        PRODUCT_NAME: ReceiptKit
        PRODUCT_BUNDLE_IDENTIFIER: com.collinmurch.open-receipt.ReceiptKit
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  ReceiptLab:
    type: application
    platform: macOS
    sources:
      - path: Tools/ReceiptLab
        excludes: *agentExcludes
    dependencies:
      - target: ReceiptKit
    settings:
      base:
        PRODUCT_NAME: ReceiptLab
        PRODUCT_BUNDLE_IDENTIFIER: com.collinmurch.open-receipt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/OpenReceipt.entitlements

schemes:
  open-receipt:
    build:
      targets:
        open-receipt: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - open-receiptTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  ReceiptLab:
    build:
      targets:
        ReceiptLab: all
    run:
      config: Release
